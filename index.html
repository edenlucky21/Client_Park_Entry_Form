<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Uganda Wildlife Authority - Park Entry Form</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body>
  <div class="container">
    <div class="logo-container">
      <img src="UWA.png" alt="UWA Logo" class="uwa-logo" />
      <h1>UGANDA WILDLIFE AUTHORITY</h1>
      <h2>Official Park Entry Registration System</h2>
    </div>

    <!-- CATEGORY DROPDOWN -->
    <label style="margin-top:25px; font-size:16px; font-weight:700;">Select Visitor Category:</label>
    <select id="categorySelect">
      <option value="">-- Please Select --</option>
      <option value="tourist">🎫 Tourist</option>
      <option value="transit">🚗 Transit Visitor</option>
      <option value="student">🎓 Student Group</option>
    </select>

    <style>
      /* hide all forms by default */
      .form-section { display: none; }
      .form-section.active { display: block; }
    </style>

    <!-- TOURIST FORM -->
    <form id="touristForm" class="form-section" action="/submit_form" method="POST" enctype="multipart/form-data">
      <input type="hidden" name="form_type" value="tourist" />
      <h3>👥 Tourist Visitor Information</h3>

      <div id="clientList">
        <div class="client">
          <label>Full Name: <span style="color:#d32f2f;">*</span></label>
          <input type="text" name="client_name[]" required placeholder="Enter full name" />
          
          <label>Contact Number: <span style="color:#d32f2f;">*</span></label>
          <input type="tel" name="client_contact[]" required placeholder="Phone number" />

          <label>Visitor Type: <span style="color:#d32f2f;">*</span></label>
          <select name="visitor_type" required>
            <option value="">-- Select Visitor Type --</option>
            <option value="FNR">Foreign Non-Resident (FNR)</option>
            <option value="FR">Foreign Resident (FR)</option>
            <option value="ROA">Rest of Africa (ROA)</option>
            <option value="EAC">East African Community (EAC)</option>
            <option value="CHILD">Child</option>
          </select>

          <label style="margin-top:20px; font-weight:700; color:#0b6623;">🌍 Nationality: <span style="color:#d32f2f;">*</span></label>
          <select name="client_nationality[]" class="nationality-dropdown" required>
            <option value="">--Select Nationality--</option>
          </select>
        </div>
      </div>

      <button type="button" id="addClientBtn" class="btn">➕ Add Another Visitor</button>

      <h3>🚗 Vehicle Information</h3>
      <div id="vehicleList">
        <div class="vehicle">
          <label>Type of Vehicle:</label>
          <input type="text" name="car_type[]" placeholder="e.g., Sedan, SUV, Van" />
          
          <label>Registration Number:</label>
          <input type="text" name="car_reg[]" placeholder="e.g., UG ABC 123" />
          
          <label>Driver Name:</label>
          <input type="text" name="driver_name[]" placeholder="Driver full name" />
          
          <label>Driver Phone:</label>
          <input type="tel" name="driver_phone[]" placeholder="Driver contact" />
        </div>
      </div>
      <button type="button" id="addVehicleBtn" class="btn">➕ Add Another Vehicle</button>

      <h3>🎯 Planned Activities</h3>
      <div class="activities-section">
        <label><input type="checkbox" name="activities" value="Game Drive" /> 🦁 Game Drive</label>
        <label><input type="checkbox" name="activities" value="Boat Cruise" /> ⛵ Boat Cruise</label>
        <label><input type="checkbox" name="activities" value="Top of Falls Viewing" /> 💧 Waterfall Viewing</label>
        <label><input type="checkbox" name="activities" value="Sport Fishing" /> 🎣 Sport Fishing</label>
      </div>

      <button type="submit" class="submitBtn">✓ Submit Registration</button>
    </form>

    <!-- TRANSIT FORM -->
    <form id="transitForm" class="form-section" action="/submit_form" method="POST">
      <input type="hidden" name="form_type" value="transit" />
      <h3 style="color:#0b6623; margin-bottom:25px; text-align:center;">🚗 TRANSIT PASS REGISTRATION</h3>

      <div style="background:#f8fdf8; padding:20px; border-radius:8px; border-left:4px solid #0b6623;">
        <h4 style="color:#0b6623; margin-top:0;">Visitor Information</h4>
        
        <label style="display:block; margin-bottom:15px;">
          <span style="font-weight:700; color:#0b6623;">Your Full Name <span style="color:#d32f2f;">*</span></span>
          <input type="text" name="transit_name" required placeholder="e.g., John Smith" style="width:100%; padding:10px; margin-top:5px; border:1px solid #cde5cd; border-radius:4px;" />
        </label>
        
        <label style="display:block; margin-bottom:15px;">
          <span style="font-weight:700; color:#0b6623;">Contact Phone <span style="color:#d32f2f;">*</span></span>
          <input type="tel" name="transit_contact" required placeholder="e.g., 0776 123 456" style="width:100%; padding:10px; margin-top:5px; border:1px solid #cde5cd; border-radius:4px;" />
        </label>

        <label style="display:block; margin-bottom:15px;">
          <span style="font-weight:700; color:#0b6623;">Your Nationality <span style="color:#d32f2f;">*</span></span>
          <select name="nationality" class="nationality-dropdown" required style="width:100%; padding:10px; margin-top:5px; border:1px solid #cde5cd; border-radius:4px;">
            <option value="">-- Select Your Country --</option>
          </select>
        </label>

        <label style="display:block; margin-bottom:15px;">
          <span style="font-weight:700; color:#0b6623;">Visitor Classification <span style="color:#d32f2f;">*</span></span>
          <select name="visitor_type" required style="width:100%; padding:10px; margin-top:5px; border:1px solid #cde5cd; border-radius:4px;">
            <option value="">-- Select Your Category --</option>
            <option value="FNR">International Visitor (FNR)</option>
            <option value="FR">Foreign Resident (FR)</option>
            <option value="ROA">African Union (ROA)</option>
            <option value="EAC">East African Citizen (EAC)</option>
            <option value="CHILD">Child</option>
          </select>
        </label>
      </div>

      <div style="background:#f8fdf8; padding:20px; border-radius:8px; border-left:4px solid #d4af37; margin-top:20px;">
        <h4 style="color:#0b6623; margin-top:0;">🚗 Vehicle Details</h4>
        
        <label style="display:block; margin-bottom:15px;">
          <span style="font-weight:700; color:#0b6623;">Vehicle Registration Number <span style="color:#d32f2f;">*</span></span>
          <input type="text" name="transit_reg" required placeholder="e.g., UG ABC 123" style="width:100%; padding:10px; margin-top:5px; border:1px solid #cde5cd; border-radius:4px;" />
        </label>
      </div>

      <button type="submit" class="submitBtn" style="margin-top:25px; width:100%; padding:14px; font-size:16px; font-weight:700;">✓ SUBMIT REGISTRATION</button>
    </form>

    <!-- STUDENT FORM -->
    <form id="studentForm" class="form-section" action="/submit_form" method="POST">
      <input type="hidden" name="form_type" value="student" />
      <h3>🎓 Student Group Information</h3>

      <label>School/Institution Name: <span style="color:#d32f2f;">*</span></label>
      <input type="text" name="student_school" required placeholder="School or institution name" />
      
      <label>Institution Address: <span style="color:#d32f2f;">*</span></label>
      <input type="text" name="institution" required placeholder="Full institution address" />
      
      <label>Contact Number: <span style="color:#d32f2f;">*</span></label>
      <input type="tel" name="student_contact" required placeholder="School contact number" />

      <label>Visitor Type: <span style="color:#d32f2f;">*</span></label>
      <select name="visitor_type" required>
        <option value="">-- Select Visitor Type --</option>
        <option value="FNR">Foreign Non-Resident</option>
        <option value="FR">Foreign Resident</option>
        <option value="ROA">Rest of Africa</option>
        <option value="EAC">EAC</option>
        <option value="CHILD">Child</option>
      </select>

      <label style="margin-top:20px; font-weight:700; color:#0b6623;">🌍 Nationality: <span style="color:#d32f2f;">*</span></label>
      <select name="nationality" class="nationality-dropdown" required>
        <option value="">--Select Nationality--</option>
      </select>

      <button type="submit" class="submitBtn">✓ Submit Registration</button>
    </form>
    
  </div>

  <script>
    const select = document.getElementById('categorySelect');
    const forms = {
      tourist: document.getElementById('touristForm'),
      transit: document.getElementById('transitForm'),
      student: document.getElementById('studentForm')
    };

    select.addEventListener('change', () => {
      const value = select.value;

      // hide all
      Object.values(forms).forEach(f => f.classList.remove('active'));

      // show selected
      if (forms[value]) forms[value].classList.add('active');
    });
  </script>
  
  <p class="admin-link"><a href="/admin" target="_blank">🔐 Admin Dashboard</a></p>
  <p class="admin-link"><a href="/qr" target="_blank">📱 QR Code for Clients</a></p>

  </div>

  <script src="script.js"></script>

</body>
</html>

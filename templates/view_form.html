<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Park Entry Form Details - ID {{ record[0] }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    @media print { .no-print { display: none; } }
    .print-btn { background:#0b6623; color:white; padding:8px 12px; border:none; cursor:pointer; }
    .form-details { margin: 20px 0; }
    .form-details table { width: 100%; border-collapse: collapse; }
    .form-details th, .form-details td { padding: 10px; text-align: left; border: 1px solid #ddd; }
    .form-details th { background-color: #f2f2f2; width: 30%; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Park Entry Form Details</h2>

    <div class="form-details">
      <table>
        <tr><th>ID</th><td>{{ record[0] }}</td></tr>
        <tr><th>Form Type</th><td>{{ record[1] or '—' }}</td></tr>
        <tr><th>Visitor Type</th><td>{{ record[2] or '—' }}</td></tr>
        <tr><th>Date Submitted</th><td>{{ record[4] or '—' }}</td></tr>
      </table>
    </div>

    <h3>Submitted Data</h3>
    <div class="form-details">
      <pre style="white-space: pre-wrap; word-break: break-word;">{{ record_data | tojson(indent=2) }}</pre>
    </div>

    <div class="no-print" style="margin-top:20px;">
      <button class="print-btn" onclick="window.print()">Print Form</button>
      <a href="{{ url_for('download_pdf', form_id=record[0]) }}" style="margin-left: 10px;">Download PDF</a>
      <a href="{{ url_for('admin') }}" style="margin-left: 10px;">Back to Admin</a>
    </div>
  </div>
</body>
</html>
